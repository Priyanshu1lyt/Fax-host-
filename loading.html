<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - Fax Cloud</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: backgroundShift 15s ease infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes backgroundShift {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(30px, 30px);
            }
        }

        .loading-container {
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Advanced Spinner */
        .spinner {
            width: 100px;
            height: 100px;
            margin: 0 auto 35px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .spinner-ring {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid #fff;
            border-right: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: spin 2s linear infinite;
            position: absolute;
        }

        .spinner-ring:nth-child(2) {
            width: 75%;
            height: 75%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-top: 4px solid rgba(255, 255, 255, 0.5);
            border-right: 4px solid transparent;
            border-bottom: 4px solid rgba(255, 255, 255, 0.3);
            animation: spinReverse 3s linear infinite;
        }

        .spinner-inner {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes spinReverse {
            0% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }
        }

        .loading-text {
            color: #fff;
            font-size: 1.3rem;
            margin-top: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .dot {
            display: inline-block;
            width: 6px;
            opacity: 0;
            animation: dotAnimation 1.4s infinite;
        }

        .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotAnimation {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            margin-top: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Progress bar */
        .progress-bar {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            margin: 25px auto 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fff, rgba(255, 255, 255, 0.5), #fff);
            border-radius: 10px;
            animation: progressMove 2s ease-in-out infinite;
        }

        @keyframes progressMove {
            0% {
                width: 0%;
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
            50% {
                width: 100%;
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            }
            100% {
                width: 0%;
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
        }

        /* Status indicator */
        .status {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: statusBounce 1.4s infinite;
        }

        .status-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .status-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .status-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes statusBounce {
            0%, 100% {
                background: rgba(255, 255, 255, 0.4);
                transform: scale(1);
            }
            50% {
                background: rgba(255, 255, 255, 0.9);
                transform: scale(1.3);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .loading-container {
                padding: 30px 20px;
                margin: 20px;
            }

            .logo {
                font-size: 2.2rem;
                margin-bottom: 20px;
            }

            .loading-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading container -->
    <div class="loading-container">
        <div class="logo">☁️ Fax Cloud</div>
        
        <div class="spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-inner"></div>
        </div>

        <div class="loading-text">
            Loading<span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
        
        <div class="loading-subtext">
            Preparing your cloud experience
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="status">
            <div class="status-dot"></div>
            <div class="status-dot"></div>
            <div class="status-dot"></div>
        </div>
    </div>

    <script>
        // Optional: Redirect after a set time or when page is fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Remove the loading page after 5 seconds
            // setTimeout(function() {
            //     window.location.href = '/index.html'; // Change to your main page
            // }, 5000);
        });

        // Alternative: Remove loading page when main content is ready
        window.addEventListener('load', function() {
            // Uncomment the line below to auto-redirect when all resources are loaded
            // window.location.href = '/index.html';
        });
    </script>
</body>
</html>
